<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор экономии</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <div class="card" id="screen-place">
      <h1>Калькулятор экономии</h1>
      <p class="sub">Выберите место</p>

      <div class="places">
        <button class="place-btn" onclick="choosePlace('Дом')">Дом</button>
        <button class="place-btn" onclick="choosePlace('Офис')">Офис</button>
      </div>
    </div>

    <div class="card hidden" id="screen-form">
      <span class="badge" id="badge-place">Дом</span>
      <h1>Новое мероприятие</h1>

      <label>Название
        <input type="text" id="mName" value="Замена лампочек">
      </label>

      <div class="row">
        <div>
          <label>Старая мощность, Вт
            <input type="number" id="powerOld" value="60" min="1">
          </label>
        </div>
        <div>
          <label>Новая мощность, Вт
            <input type="number" id="powerNew" value="9" min="1">
          </label>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Часов в день
            <input type="number" id="hoursDay" value="3" step="0.5" min="0.1">
          </label>
        </div>
        <div>
          <label>Тариф, руб/кВт·ч
            <input type="number" id="tariff" value="6" step="0.1" min="0.1">
          </label>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Количество
            <input type="number" id="count" value="1" min="1" step="1">
          </label>
        </div>
        <div>
          <label>Цена за штуку, руб
            <input type="number" id="price" value="300" min="1">
          </label>
        </div>
      </div>

      <button class="btn" onclick="calculate()">Посчитать</button>
      <button class="btn secondary" onclick="goBack()">Назад</button>
    </div>

    <div class="card hidden" id="screen-result">
      <span class="badge" id="badge-place-result">Дом</span>
      <h1 id="result-title">Результат</h1>
      <p class="sub" id="result-place"></p>

      <div class="result-block">
        <div class="res-item">
          <span class="label">Бюджет</span>
          <span class="value" id="r-budget">0</span>
        </div>
        <div class="res-item">
          <span class="label">Экономия в год</span>
          <span class="value" id="r-savings">0</span>
        </div>
        <div class="res-item">
          <span class="label">Окупаемость</span>
          <span class="value" id="r-payback">0</span>
        </div>
        <div class="res-item highlight">
          <span class="label">За 5 лет</span>
          <span class="value" id="r-earn5y">0</span>
        </div>
      </div>

      <button class="btn" onclick="newMeasure()">Ещё мероприятие</button>
      <button class="btn secondary" onclick="goHome()">На главную</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
